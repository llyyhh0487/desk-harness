<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DESK HARNESS — 终端</title>
<link rel="stylesheet" href="node_modules/xterm/css/xterm.css">
<style>
  :root { --bg: #0c101e; --panel: rgba(16, 22, 38, 0.96); --fg: #c9d4e8; --dim: #7d8bab; --line: rgba(120, 160, 240, 0.18); --accent: #4d6bfe; --accent2: #00e5ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 60% at 85% -10%, rgba(77, 107, 254, 0.14), transparent 60%),
      radial-gradient(90% 50% at -10% 110%, rgba(0, 229, 255, 0.08), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    border-left: 1px solid rgba(120, 160, 240, 0.25);
    box-shadow: -12px 0 40px rgba(4, 8, 20, 0.35);
  }
  /* 入场动画：主进程每次显示时重挂该 class */
  body.dock-anim { animation: dock-in 0.24s cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes dock-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  /* 头部：拖拽区 + 标签 + 关闭 */
  .head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: linear-gradient(180deg, rgba(26, 34, 56, 0.95), rgba(20, 26, 44, 0.85));
    border-bottom: 1px solid var(--line);
    position: relative;
    -webkit-app-region: drag; user-select: none;
  }
  .head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(77, 107, 254, 0.55), rgba(0, 229, 255, 0.55), transparent);
    pointer-events: none;
  }
  .head button, .head input, .tabs button { -webkit-app-region: no-drag; }
  .tabs { display: flex; gap: 5px; }
  .tab {
    background: transparent; border: 1px solid rgba(120, 160, 240, 0.22);
    color: #8ba0c8; border-radius: 8px; padding: 4px 11px;
    font-size: 11.5px; cursor: pointer; white-space: nowrap; font-family: inherit;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
  }
  .tab:hover { border-color: rgba(120, 160, 240, 0.45); color: #d5deef; transform: translateY(-1px); }
  .tab.on {
    background: linear-gradient(135deg, rgba(77, 107, 254, 0.32), rgba(0, 229, 255, 0.14));
    color: #fff; border-color: rgba(120, 160, 240, 0.55);
    box-shadow: 0 2px 10px rgba(77, 107, 254, 0.25);
  }
  .head .spacer { flex: 1; }
  .cwd {
    font-size: 10.5px; color: var(--dim);
    background: rgba(12, 16, 30, 0.55); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36%;
  }
  .hbtn {
    background: rgba(120, 160, 240, 0.12); border: 1px solid rgba(120, 160, 240, 0.25);
    color: #b8c7e6; border-radius: 7px; padding: 3px 9px;
    font-size: 11px; cursor: pointer; font-family: inherit;
    transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
  }
  .hbtn:hover { background: rgba(120, 160, 240, 0.24); color: #fff; transform: translateY(-1px); }
  .hbtn:active { transform: scale(0.96); }
  .hbtn.close:hover { background: rgba(255, 92, 122, 0.2); color: #ff8fa3; border-color: rgba(255, 92, 122, 0.4); }
  .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .view.on { display: flex; animation: view-in 0.18s ease; }
  @keyframes view-in { from { opacity: 0.2; transform: translateX(6px); } to { opacity: 1; transform: translateX(0); } }
  /* 终端 */
  #term { flex: 1; min-height: 0; padding: 8px 10px 6px; }
  #term .xterm { height: 100%; }
  #term .xterm-viewport { scrollbar-width: thin; scrollbar-color: rgba(120, 150, 220, 0.42) transparent; }
  .term-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 5px 12px; border-top: 1px solid var(--line);
    background: rgba(20, 26, 44, 0.6); font-size: 10.5px; color: var(--dim);
  }
  .badge { padding: 1px 8px; border-radius: 8px; border: 1px solid var(--line); }
  .badge.pty { color: #34d399; border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }
  .badge.line { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.08); }
  /* 兼容模式（无 node-pty 时） */
  #lineout { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .line-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); }
  .line-row input { flex: 1; background: rgba(12, 16, 30, 0.6); border: 1px solid var(--line); border-radius: 7px; color: #c9d4e8; padding: 6px 10px; font: 12.5px Consolas, monospace; outline: none; }
  .line-row input:focus { border-color: rgba(120, 160, 240, 0.5); }
  /* 文档 */
  .docpath { flex: 0 0 auto; padding: 7px 12px; font-size: 11px; color: #8ab4ff; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doctabs { flex: 0 0 auto; display: flex; gap: 4px; padding: 6px 12px 0; overflow-x: auto; }
  .doctab { display: flex; align-items: center; gap: 6px; max-width: 180px; padding: 4px 10px; background: rgba(120, 160, 240, 0.1); border: 1px solid rgba(120, 160, 240, 0.2); border-radius: 7px 7px 0 0; color: #9db2d8; font-size: 11.5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .doctab.on { background: rgba(77, 107, 254, 0.26); color: #fff; }
  .doctab .tn { overflow: hidden; text-overflow: ellipsis; }
  .doctab .tx { color: #7d8bab; border: none; background: transparent; cursor: pointer; font-size: 12px; font-family: inherit; }
  .doctab .tx:hover { color: #f87171; }
  .docbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  .docstatus { font-size: 11px; color: #34d399; }
  .docstatus.err { color: #f87171; }
  #editor { flex: 1; min-height: 0; background: rgba(12, 16, 30, 0.55); border: none; outline: none; color: #c9d4e8; padding: 12px 14px; font: 12.5px/1.65 Consolas, monospace; resize: none; }
  .drophint { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; border: 2px dashed rgba(120, 160, 240, 0.3); border-radius: 10px; color: var(--dim); font-size: 12.5px; background: rgba(12, 16, 30, 0.8); z-index: 50; }
  body.drag-over .drophint { display: flex; }
  /* 工作区文件 */
  .files-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .files-hint { flex: 1; min-width: 0; font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .fchip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; background: rgba(120, 160, 240, 0.1); border: 1px solid rgba(120, 160, 240, 0.18); cursor: pointer; user-select: none; transition: background 0.14s ease, transform 0.14s ease; }
  .fchip:hover { background: rgba(120, 160, 240, 0.2); transform: translateX(2px); }
  .fchip .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .fchip .size { font-size: 10.5px; color: var(--dim); }
  .fchip .del { background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; font-family: inherit; }
  .fchip .del:hover { background: rgba(255, 92, 122, 0.18); color: #ff8fa3; }
  .empty { padding: 26px 12px; text-align: center; font-size: 11.5px; color: var(--dim); line-height: 1.8; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(120, 150, 220, 0.42); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(120, 150, 220, 0.68); }
</style>
</head>
<body>
  <div class="head">
    <div class="tabs">
      <button class="tab t-term on" id="tab-term">&gt;_ 终端</button>
      <button class="tab t-doc" id="tab-doc">📄 文档</button>
      <button class="tab t-files" id="tab-files">📁 工作区文件</button>
    </div>
    <div class="spacer"></div>
    <span class="cwd" id="cwd"></span>
    <button class="hbtn" id="btn-kill" title="终止当前命令 (Ctrl+C)">■</button>
    <button class="hbtn" id="btn-clear" title="清屏">清屏</button>
    <button class="hbtn close" id="btn-close" title="关闭">✕</button>
  </div>

  <div class="view on" id="view-term">
    <div id="term"></div>
    <div class="term-bar"><span class="badge" id="mode-badge">…</span><span id="term-status">就绪</span></div>
  </div>

  <div class="view" id="view-doc">
    <div class="docpath" id="docpath">尚未打开文档</div>
    <div class="doctabs" id="doctabs"></div>
    <div class="docbar">
      <button class="hbtn" id="btn-opendoc">打开文档…</button>
      <button class="hbtn" id="btn-save">💾 保存</button>
      <button class="hbtn" id="btn-reload">↻ 重新加载</button>
      <span class="docstatus" id="docstatus"></span>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>

  <div class="view" id="view-files">
    <div class="files-bar">
      <span class="files-hint" id="files-hint">files/ — DeepSeek 可直接读取</span>
      <button class="hbtn" id="btn-addfiles">＋添加文件</button>
    </div>
    <div class="files-list" id="files-list"></div>
  </div>

  <div class="drophint">📄 拖入文件：在工作区文件页 = 复制进 files/；在文档页 = 直接阅读</div>

  <script src="node_modules/xterm/lib/xterm.js"></script>
  <script src="dock.js"></script>
</body>
</html>
