<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DESK HARNESS — 网页输入框/气泡 皮肤预览</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #070b16 0%, #0d1226 45%, #141a38 100%);
    min-height: 100vh; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #dbe4f5; padding: 26px; user-select: none;
  }
  h1 { font-size: 18px; letter-spacing: 0.6px; color: #cdd9ff; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #7d8bab; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    padding: 7px 16px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    border: 1px solid rgba(120,160,240,0.35); background: rgba(30,40,70,0.6); color: #9db2d8;
    transition: all .2s;
  }
  .tab.on { background: linear-gradient(90deg, rgba(77,107,254,0.6), rgba(0,229,255,0.4)); color: #fff; border-color: rgba(120,160,240,0.7); box-shadow: 0 0 14px rgba(77,107,254,0.4); }
  .panel { display: none; }
  .panel.on { display: block; }

  /* ====== 聊天区骨架 ====== */
  .chat { max-width: 560px; margin: 0 auto; background: rgba(10,14,26,0.55); border: 1px solid rgba(120,140,200,0.18); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 13px; font-size: 13px; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2f4bd8, #3b6bff); color: #fff; border-bottom-right-radius: 5px; }
  .msg.ai { align-self: flex-start; background: rgba(32,40,66,0.9); border: 1px solid rgba(120,160,240,0.22); border-bottom-left-radius: 5px; color: #d7e2ff; }

  /* ====== 玻璃皮肤（选中状态） ====== */
  body.glass .msg.user {
    background: linear-gradient(135deg, rgba(90,110,255,0.38), rgba(60,170,255,0.22));
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(140,160,255,0.45);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  body.glass .msg.ai {
    background: linear-gradient(135deg, rgba(38,50,86,0.55), rgba(26,34,60,0.45));
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid rgba(130,150,220,0.28);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  body.glass .msg { transition: transform .18s ease, box-shadow .18s ease; }
  body.glass .msg:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 18px rgba(77,107,254,0.25); }

  /* ====== 输入区骨架 ====== */
  .composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 4px; }
  .input { flex: 1; background: rgba(22,30,52,0.9); border: 1px solid rgba(120,160,240,0.25); border-radius: 12px; padding: 10px 13px; font-size: 13px; color: #e6eefc; min-height: 40px; }
  .input::placeholder { color: #7d8bab; }
  .send { width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(135deg, #4d6bfe, #00b8ff); color: #fff; font-size: 15px; }
  /* 玻璃输入区（选中状态） */
  body.glass .input {
    background: rgba(28,38,70,0.4);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border: 1px solid rgba(140,160,255,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 18px rgba(0,0,0,0.25);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  body.glass .input:focus {
    outline: none; border-color: rgba(120,160,255,0.75);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 3px rgba(77,107,254,0.22), 0 0 22px rgba(77,107,254,0.35);
    transform: translateY(-1px);
  }
  body.glass .send {
    background: linear-gradient(135deg, rgba(90,110,255,0.5), rgba(0,184,255,0.4));
    backdrop-filter: blur(14px);
    border: 1px solid rgba(140,160,255,0.45);
    box-shadow: 0 4px 16px rgba(77,107,254,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform .18s, box-shadow .18s;
  }
  body.glass .send:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(77,107,254,0.55); }

  .foot { text-align: center; margin-top: 14px; font-size: 11.5px; color: #7d8bab; }
  .foot b { color: #cdd9ff; }
  .tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(52,211,153,0.4); color: #34d399; margin-left: 6px; vertical-align: 1px; }
</style>
</head>
<body>
  <h1>🪟 网页输入框 / 聊天气泡 · 玻璃皮肤预览</h1>
  <div class="sub">点下方标签切换「当前 / 玻璃皮肤」，对比效果。桌面端默认<u>关闭</u>此皮肤，控制面板可开。</div>
  <div class="tabs">
    <div class="tab on" data-mode="plain">当前样式</div>
    <div class="tab" data-mode="glass">玻璃皮肤（毛玻璃 + 辉光 + 微交互）</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg ai">你好！我是 DESK HARNESS。可以把文件拖进来，或点输入框左边的 📎 上传。</div>
    <div class="msg user">帮我分析这份荔枝采摘社会实践报告，并给出修改建议。</div>
    <div class="msg ai">好的，我读到了报告全文（约1800字）……主题是茂名化州荔枝采摘志愿服务，文笔生动。建议：①开头可加一句总起；②“荔海”比喻很妙，可呼应结尾；③结尾的升华与开头“甜蜜的负担”形成闭环会更完整。</div>
    <div class="composer">
      <div class="input" contenteditable="true" data-placeholder="给 DESK HARNESS 发送消息…"></div>
      <div class="send">➤</div>
    </div>
  </div>
  <div class="foot">桌面端效果参考 —— <b>毛玻璃输入框</b><span class="tag">聚焦辉光</span> + <b>渐变气泡</b><span class="tag">hover 微抬升</span></div>

<script>
  (function () {
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        tabs.forEach(function (x) { x.classList.remove('on'); });
        t.classList.add('on');
        document.body.classList.toggle('glass', t.getAttribute('data-mode') === 'glass');
      });
    });
    var inp = document.querySelector('.input');
    inp.addEventListener('input', function () {
      if (inp.textContent.trim() === '') inp.dataset.placeholder = '给 DESK HARNESS 发送消息…';
    });
  })();
</script>
</body>
</html>
